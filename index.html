<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de Proyectos</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7480;--ac:#1f7a4d;--bd:#dde1e6;--ac2:#e3f3ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1e2327;--tx:#eceff2;--mu:#98a2ad;--ac:#3fc283;--bd:#313940;--ac2:#1d3a2c}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1e2327;--tx:#eceff2;--mu:#98a2ad;--ac:#3fc283;--bd:#313940;--ac2:#1d3a2c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:12px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;min-width:0}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:transparent;color:var(--mu);border:1px solid var(--bd)}
button.x{background:transparent;color:#c0392b;padding:4px 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input{flex:1}
.proj{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--bd);border-radius:10px;margin-top:8px;cursor:pointer}
.mu{color:var(--mu);font-size:14px}
.wrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;font-size:14px}
th,td{border:1px solid var(--bd);padding:0;text-align:center;min-width:34px;height:38px}
th{background:var(--bg);font-weight:600}
td.n,th.n{position:sticky;left:0;background:var(--card);min-width:170px;max-width:170px;text-align:left;padding:4px 8px;z-index:1}
td.t{min-width:84px;padding:4px 8px;white-space:nowrap}
td.d{cursor:pointer;user-select:none}
td.on{background:var(--ac);color:#fff}
td.hoy{outline:2px solid var(--ac);outline-offset:-2px}
.tot{font-size:20px;font-weight:700;color:var(--ac)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9;padding-top:env(safe-area-inset-top,0px)}
.md{background:var(--card);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.md label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.md input,.md select{width:100%}
</style>
</head>
<body>
<div id="app"></div>
<script>
var K='asistencia_v1',S={proyectos:[]},pid=null,ed=null,mes=new Date().toISOString().slice(0,7);
try{var r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,9)}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return '$'+n.toLocaleString('es-MX',{maximumFractionDigits:2})}
function P(){return S.proyectos.find(function(p){return p.id===pid})}

function render(){
  if(!un)return lock();
  var h='';
  if(!pid||!P()){
    h+='<div class="row" style="justify-content:space-between"><h1>Mis proyectos</h1><div class="row"><button class="g" onclick="un=false;render()">🔒 Bloquear</button><button class="g" onclick="chPin()">Cambiar PIN</button></div></div><div class="card"><div class="row"><input id="np" placeholder="Nombre del proyecto"><select id="ne"><option value="pendiente">Pendiente</option><option value="proceso">En proceso</option><option value="terminado">Terminado</option></select><button onclick="addP()">Agregar</button></div>';
    ES.forEach(function(e){
      var L=S.proyectos.filter(function(p){return (p.estado||'proceso')===e[0]});
      h+='<h3 style="margin:16px 0 0;font-size:15px">'+e[1]+' ('+L.length+')</h3>';
      L.forEach(function(p){
        h+='<div class="proj" onclick="pid=\''+p.id+'\';render()"><div><b>'+esc(p.nombre)+'</b><div class="mu">'+p.trab.length+' trabajadores · '+(e[0]==='terminado'?'Total pagado: ':'Pagado hasta hoy: ')+money(totP(p).total)+'</div></div><span>›</span></div>';
      });
      if(!L.length)h+='<div class="mu" style="margin-top:6px">Ninguno</div>';
    });
    if(!S.proyectos.length)h+='<p class="mu">Aún no hay proyectos. Crea el primero arriba.</p>';
    h+='</div>';
  }else{
    var p=P(),y=+mes.slice(0,4),m=+mes.slice(5),nd=new Date(y,m,0).getDate(),hoy=new Date().toISOString().slice(0,10);
    var nom=new Date(y,m-1,1).toLocaleDateString('es-MX',{month:'long',year:'numeric'});
    h+='<div class="row" style="margin-bottom:8px"><button class="g" onclick="pid=null;render()">‹ Proyectos</button><button class="x" onclick="delP()">Borrar proyecto</button></div>';
    h+='<h1>'+esc(p.nombre)+'</h1>';
    h+='<div class="card"><div class="mu">Estado del proyecto</div><select style="width:100%;margin-top:6px" onchange="setE(this.value)">'+ES.map(function(e){return '<option value="'+e[0]+'"'+((p.estado||'proceso')===e[0]?' selected':'')+'>'+e[1]+'</option>'}).join('')+'</select></div>';
    if((p.estado||'proceso')==='terminado'){var T=totP(p);h+='<div class="card" style="border-color:var(--ac)"><div class="mu">Proyecto terminado'+(p.fin?' el '+p.fin:'')+' · Total gastado en pagos</div><div class="tot">'+money(T.total)+'</div><div class="mu" style="margin:6px 0">'+T.dias+' días trabajados en total</div>'+T.det.map(function(x){return '<div class="row" style="justify-content:space-between;border-top:1px solid var(--bd);padding:6px 0"><span>'+esc(x.n)+' <span class="mu">('+x.d+' días)</span></span><b>'+money(x.m)+'</b></div>'}).join('')+'</div>';}
    h+='<div class="card row" style="justify-content:space-between"><button class="g" onclick="cm(-1)">‹</button><b style="text-transform:capitalize">'+nom+'</b><button class="g" onclick="cm(1)">›</button></div>';
    h+='<div class="card"><div class="row"><input id="nn" placeholder="Nombre"><input id="na" placeholder="Apellido"><input id="nr" type="number" inputmode="decimal" placeholder="Pago por día" style="max-width:130px"><button onclick="addW()">Agregar</button></div></div>';
    var total=0;
    if(p.trab.length){
      h+='<div class="card wrap"><table><tr><th class="n">Trabajador</th>';
      var DS=['Do','Lu','Ma','Mi','Ju','Vi','Sá'];
      for(var d=1;d<=nd;d++){var wd=new Date(y,m-1,d).getDay();h+='<th'+(wd==0||wd==6?' style="background:var(--ac2)"':'')+'><div class="mu" style="font-size:11px">'+DS[wd]+'</div>'+d+'</th>';}
      h+='<th>Días</th><th>Total</th></tr>';
      p.trab.forEach(function(w){
        var c=0,cells='';
        for(var d=1;d<=nd;d++){
          var f=mes+'-'+(d<10?'0'+d:d),on=w.dias[f];
          if(on)c++;
          cells+='<td class="d'+(on?' on':'')+(f===hoy?' hoy':'')+'" onclick="tg(\''+w.id+'\',\''+f+'\')">'+(on?'✓':'')+'</td>';
        }
        var t=c*w.pago;total+=t;
        h+='<tr><td class="n"><b style="text-decoration:underline;cursor:pointer" onclick="ed=\''+w.id+'\';render()">'+esc(w.nombre+(w.apellido?' '+w.apellido:''))+'</b><br><span class="mu">$<input type="number" inputmode="decimal" value="'+w.pago+'" onchange="setR(\''+w.id+'\',this.value)" style="width:72px;padding:4px"> /día</span><br><button style="padding:5px 9px;font-size:13px;margin-top:4px" onclick="ed=\''+w.id+'\';render()">📋 Datos</button> <button class="g" style="padding:5px 9px;font-size:13px;margin-top:4px;color:#c0392b;border-color:#c0392b" onclick="delW(\''+w.id+'\')">🗑 Borrar</button></td>'+cells+'<td class="t">'+c+'</td><td class="t"><b>'+money(t)+'</b></td></tr>';
      });
      h+='</table></div><div class="card"><div class="mu">Total a pagar del mes</div><div class="tot">'+money(total)+'</div></div>';
    }else h+='<p class="mu">Agrega trabajadores para empezar a marcar asistencia.</p>';
  }
  var w=ed&&P()?P().trab.find(function(x){return x.id===ed}):null;
  if(w){
    var tp=['Ahorros','Corriente','Otra'];
    var sb=BK.indexOf(w.banco)>-1?w.banco:(w.banco?'Otro':'');
    h+='<div class="ov"><div class="md"><div class="row" style="justify-content:space-between"><b style="font-size:18px">Datos del trabajador</b><button class="g" onclick="ed=null;render()">Cerrar</button></div>'
    +'<label>Nombre</label><input value="'+esc(w.nombre)+'" onchange="setF(\'nombre\',this.value)">'
    +'<label>Apellido</label><input value="'+esc(w.apellido||'')+'" onchange="setF(\'apellido\',this.value)">'
    +'<label>Teléfono</label><input type="tel" inputmode="tel" value="'+esc(w.telefono||'')+'" onchange="setF(\'telefono\',this.value)">'
    +'<label>Tipo de documento</label><select onchange="setF(\'tdoc\',this.value);render()">'
    +['Cédula','Pasaporte'].map(function(t){return '<option'+((w.tdoc||'Cédula')===t?' selected':'')+'>'+t+'</option>'}).join('')+'</select>'
    +'<label>Número de '+((w.tdoc||'Cédula')==='Pasaporte'?'pasaporte':'cédula')+'</label><input value="'+esc(w.cedula||'')+'" onchange="setF(\'cedula\',this.value)">'
    +'<label>Banco</label><select onchange="setB(this.value)"><option value="">Seleccionar</option>'
    +BK.map(function(b){return '<option'+(sb===b?' selected':'')+'>'+b+'</option>'}).join('')+'<option'+(sb==='Otro'?' selected':'')+'>Otro</option></select>'
    +(sb==='Otro'?'<input style="margin-top:8px" placeholder="Escribe el nombre del banco" value="'+esc(w.banco==='Otro'?'':w.banco)+'" onchange="setB(this.value||\'Otro\',1)">':'')
    +'<label>Tipo de cuenta</label><select onchange="setF(\'tipo\',this.value)"><option value="">Seleccionar</option>'
    +tp.map(function(t){return '<option'+(w.tipo===t?' selected':'')+'>'+t+'</option>'}).join('')+'</select>'
    +'<label>Número de cuenta</label><input inputmode="numeric" value="'+esc(w.cuenta||'')+'" onchange="setF(\'cuenta\',this.value)">'
    +'<p class="mu">Se guarda automáticamente en este dispositivo.</p><button class="g" style="width:100%;color:#c0392b;border-color:#c0392b" onclick="delW(\''+w.id+'\')">🗑 Borrar este trabajador</button></div></div>';
  }
  $('app').innerHTML=h;
}
var BK=['Banco Popular Dominicano','Banreservas','Banco BHD','Scotiabank','Banco Santa Cruz','Banesco','Banco Caribe','Banco Promerica','Banco BDI','Banco López de Haro','Banco Vimenca','Banco Lafise','Banco ADEMI','Banco ADOPEM','Banco Activo','Banco Agrícola','Citibank','Asociación Popular','Asociación Cibao','Asociación La Nacional','Asociación Duarte'];
var PK='asistencia_pin',un=false;
function hsh(s){return Promise.resolve().then(function(){if(window.crypto&&crypto.subtle){return crypto.subtle.digest('SHA-256',new TextEncoder().encode('as:'+s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return 'x'+h})}
function gp(){try{return localStorage.getItem(PK)}catch(e){return null}}
function lock(){var has=gp();
  $('app').innerHTML='<div class="card" style="margin-top:12vh;text-align:center"><div style="font-size:40px">🔒</div><h1>'+(has?'Ingresa tu PIN':'Crea tu PIN')+'</h1><input id="pn" type="password" inputmode="numeric" maxlength="6" placeholder="PIN (4 a 6 números)" style="width:100%;text-align:center;font-size:22px">'+(has?'':'<input id="pc" type="password" inputmode="numeric" maxlength="6" placeholder="Repite el PIN" style="width:100%;text-align:center;font-size:22px;margin-top:8px">')+'<p id="pe" style="color:#c0392b;min-height:20px;margin:8px 0"></p><button style="width:100%" onclick="goPin()">'+(has?'Entrar':'Guardar PIN')+'</button></div>';}
function goPin(){var v=$('pn').value,has=gp();
  if(!/^\d{4,6}$/.test(v)){$('pe').textContent='El PIN debe tener de 4 a 6 números';return}
  if(!has){if(v!==$('pc').value){$('pe').textContent='Los PIN no coinciden';return}
    hsh(v).then(function(x){try{localStorage.setItem(PK,x)}catch(e){}un=true;render()});return}
  hsh(v).then(function(x){if(x===has){un=true;render()}else{$('pe').textContent='PIN incorrecto';$('pn').value=''}})}
function chPin(){if(confirm('¿Cambiar el PIN? Te pedirá crear uno nuevo.')){try{localStorage.removeItem(PK)}catch(e){}un=false;render()}}
document.addEventListener('visibilitychange',function(){if(document.hidden){un=false;render()}});
var ES=[['pendiente','Pendientes'],['proceso','En proceso'],['terminado','Terminados']];
function totP(p){var t=0,dd=0,det=p.trab.map(function(w){var d=Object.keys(w.dias).length,m=d*w.pago;t+=m;dd+=d;return{n:w.nombre+(w.apellido?' '+w.apellido:''),d:d,m:m}});return{total:t,dias:dd,det:det}}
function setE(v){var p=P();p.estado=v;if(v==='terminado')p.fin=new Date().toLocaleDateString('es-MX');save();render()}
function setB(v,noRender){var w=P().trab.find(function(x){return x.id===ed});w.banco=v;save();if(!noRender)render()}
function setF(k,v){var w=P().trab.find(function(x){return x.id===ed});w[k]=v.trim();save()}
function addP(){var v=$('np').value.trim();if(!v)return;S.proyectos.push({id:uid(),nombre:v,estado:$('ne').value,trab:[]});save();render()}
function delP(){if(confirm('¿Borrar este proyecto y todos sus datos?')){S.proyectos=S.proyectos.filter(function(p){return p.id!==pid});pid=null;save();render()}}
function addW(){var n=$('nn').value.trim(),r=parseFloat($('nr').value);if(!n||isNaN(r))return alert('Pon el nombre y el pago por día');P().trab.push({id:uid(),nombre:n,apellido:$('na').value.trim(),pago:r,dias:{}});save();render()}
function setR(id,v){var r=parseFloat(v);if(isNaN(r))return render();P().trab.find(function(x){return x.id===id}).pago=r;save();render()}
function delW(id){if(confirm('¿Quitar a este trabajador?')){var p=P();p.trab=p.trab.filter(function(w){return w.id!==id});ed=null;save();render()}}
function tg(id,f){var w=P().trab.find(function(x){return x.id===id});if(w.dias[f])delete w.dias[f];else w.dias[f]=1;save();render()}
function cm(n){var y=+mes.slice(0,4),m=+mes.slice(5)+n;var d=new Date(y,m-1,1);mes=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}
render();
</script>
</body>
</html>
