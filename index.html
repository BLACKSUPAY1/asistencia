<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de Proyectos</title>
<meta name="theme-color" content="#070b16">
<style>
:root{--bg:#070b16;--card:rgba(255,255,255,.045);--tx:#e8edf7;--mu:#8b97ad;--ac:#22d3ee;--ac2:rgba(34,211,238,.13);--bd:rgba(255,255,255,.09);--gr:linear-gradient(135deg,#22d3ee,#6366f1);--sol:#0f1527;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1000px 520px at 85% -10%,rgba(99,102,241,.25),transparent 60%),radial-gradient(800px 480px at -10% 8%,rgba(34,211,238,.15),transparent 55%),var(--bg);background-attachment:fixed;color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));min-height:100vh}
h1{font-size:20px;margin:6px 0 12px;letter-spacing:.3px}
h3{letter-spacing:.8px;text-transform:uppercase;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.28)}
input,select{font:inherit;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:10px;padding:10px;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(34,211,238,.18)}
option{background:#111827;color:#e8edf7}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 14px;background:var(--gr);color:#04121c;cursor:pointer;box-shadow:0 4px 18px rgba(34,211,238,.22)}
button.g{background:transparent;color:var(--mu);border:1px solid var(--bd);box-shadow:none}
button.x{background:transparent;color:#ff6b6b;padding:4px 8px;box-shadow:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input{flex:1}
.proj{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--bd);border-radius:12px;margin-top:8px;cursor:pointer;background:rgba(255,255,255,.03)}
.mu{color:var(--mu);font-size:14px}
.wrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;font-size:14px}
th,td{border:1px solid var(--bd);padding:0;text-align:center;min-width:34px;height:38px}
th{background:rgba(255,255,255,.05);font-weight:600}
td.n,th.n{position:sticky;left:0;background:var(--sol);min-width:170px;max-width:170px;text-align:left;padding:4px 8px;z-index:1}
td.t{min-width:84px;padding:4px 8px;white-space:nowrap}
td.d{cursor:pointer;user-select:none}
td.on{background:var(--gr);color:#04121c;font-weight:700}
td.hoy{outline:2px solid var(--ac);outline-offset:-2px}
.tot{font-size:24px;font-weight:700;color:var(--ac);text-shadow:0 0 18px rgba(34,211,238,.35)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:9;padding-top:env(safe-area-inset-top,0px)}
.md{background:var(--sol);border:1px solid var(--bd);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.md label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.md input,.md select{width:100%}
.hd{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.lg{width:46px;height:46px;flex:none;border-radius:13px;background:var(--gr);color:#04121c;font-weight:800;font-size:21px;display:grid;place-items:center;box-shadow:0 0 24px rgba(34,211,238,.45)}
.ttl{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.sc span{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
.sc b{font-size:20px}.sc b.a{color:var(--ac)}.sc b.w{color:#fbbf24}
#app{position:relative;z-index:1}
.au{position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(80px);opacity:.33;z-index:0;pointer-events:none;animation:dr 20s ease-in-out infinite alternate}
.a1{background:#6366f1;top:-18vmax;right:-14vmax}.a2{background:#22d3ee;bottom:-20vmax;left:-16vmax;animation-delay:-8s}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
@keyframes dr{to{transform:translate(8vmax,6vmax) scale(1.15)}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(34,211,238,.55)}100%{box-shadow:0 0 0 28px rgba(34,211,238,0)}}
@keyframes sk{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.card,.proj,.sc{animation:up .4s ease both}
button{transition:transform .12s,filter .12s}button:active{transform:scale(.96);filter:brightness(1.15)}
.lk{min-height:calc(100vh - 40px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.lkI{width:86px;height:86px;border-radius:26px;background:var(--gr);display:grid;place-items:center;font-size:40px;animation:pu 2.2s infinite;margin-bottom:14px}
.dots{display:flex;gap:13px;margin:18px 0 8px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.3);transition:.15s}
.dots i.f{background:var(--ac);border-color:var(--ac);box-shadow:0 0 14px var(--ac)}
.dots.sk{animation:sk .4s}
.kp{display:grid;grid-template-columns:repeat(3,74px);gap:13px;margin-top:12px}
.kp button{width:74px;height:74px;border-radius:50%;font-size:25px;padding:0;background:rgba(255,255,255,.07);border:1px solid var(--bd);color:var(--tx);box-shadow:none}
.kp button.go{background:var(--gr);color:#04121c;border:0}
.kp button.g{font-size:22px}
.dt{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
#np{flex:1 1 100%}
.wh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.wn{font-size:16px;text-decoration:underline;cursor:pointer}
.mb{display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px}
button.sm{padding:6px 10px;font-size:14px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dh{text-align:center;font-size:11px;color:var(--mu);padding:2px 0}
.dc{position:relative;height:44px;border-radius:10px;border:1px solid var(--bd);background:rgba(255,255,255,.04);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;line-height:1.1;-webkit-tap-highlight-color:transparent}
.dc b{font-size:15px}.dc i{font-style:normal;font-size:11px;height:12px}
.dc.on{background:var(--gr);color:#04121c;border-color:transparent}
.dc.half{background:rgba(34,211,238,.22);color:var(--ac);border-color:rgba(34,211,238,.45)}
.dc.xp{background:rgba(251,191,36,.18);color:#fbbf24;border-color:rgba(251,191,36,.5);cursor:not-allowed}
.dc.bl{background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 4px,transparent 4px 8px);color:var(--mu);cursor:not-allowed}
.dc.fu{opacity:.35;cursor:not-allowed}
.dc.hoy{box-shadow:0 0 0 2px var(--ac)}
.dc u{position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:#fbbf24}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.sb{background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:10px;padding:7px 10px}
.sb span{display:block;font-size:11px;color:var(--mu)}.sb b{font-size:15px}
.por{justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)}
td.xp{background:rgba(251,191,36,.18);color:#fbbf24;font-weight:800;cursor:not-allowed}
td.lk{background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 4px,transparent 4px 8px);cursor:not-allowed}
td.fu{opacity:.35;cursor:not-allowed}
.tz{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#1f2937;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:50;border:1px solid var(--bd);max-width:86%;text-align:center}
.tz.on{opacity:1;transform:translate(-50%,0)}
td.half{background:rgba(34,211,238,.22);color:var(--ac);font-weight:700}
textarea{font:inherit;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="au a1"></div><div class="au a2"></div><canvas id="bg"></canvas>
<div id="app"></div>
<script>
var K='asistencia_v1',S={proyectos:[]},pid=null,ed=null,emp=false,mes=td().slice(0,7);
try{var r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,9)}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return '$'+n.toLocaleString('es-MX',{maximumFractionDigits:2})}
function P(){return S.proyectos.find(function(p){return p.id===pid})}

function render(){
  if(!un)return lock();
  var h='';
  if(!pid||!P()){
    h+=''+dash()+'<div class="card"><div class="row"><input id="np" placeholder="Nombre del proyecto"><select id="ne"><option value="pendiente">Pendiente</option><option value="proceso">En proceso</option><option value="terminado">Terminado</option></select><button onclick="addP()">Agregar</button></div>';
    ES.forEach(function(e){
      var L=S.proyectos.filter(function(p){return (p.estado||'proceso')===e[0]});
      h+='<h3 style="margin:16px 0 0;font-size:15px">'+e[1]+' ('+L.length+')</h3>';
      L.forEach(function(p){
        h+='<div class="proj" onclick="pid=\''+p.id+'\';render()"><div><b><i class="dt" style="background:'+DC[e[0]]+';box-shadow:0 0 10px '+DC[e[0]]+'"></i>'+esc(p.nombre)+'</b><div class="mu">'+p.trab.length+' trabajadores · '+(e[0]==='terminado'?'Total gastado: ':'Gastado hasta hoy: ')+money(totP(p).total)+'</div></div><span>›</span></div>';
      });
      if(!L.length)h+='<div class="mu" style="margin-top:6px">Ninguno</div>';
    });
    if(!S.proyectos.length)h+='<p class="mu">Aún no hay proyectos. Crea el primero arriba.</p>';
    h+='</div>';
  }else{
    var p=P(),y=+mes.slice(0,4),m=+mes.slice(5),nd=new Date(y,m,0).getDate(),hoy=td();
    var nom=new Date(y,m-1,1).toLocaleDateString('es-MX',{month:'long',year:'numeric'});
    h+='<div class="row" style="margin-bottom:8px"><button class="g" onclick="pid=null;render()">‹ Proyectos</button><button class="x" onclick="delP()">Borrar proyecto</button></div>';
    h+='<h1>'+esc(p.nombre)+'</h1>';
    h+='<div class="card"><div class="mu">Estado del proyecto</div><select style="width:100%;margin-top:6px" onchange="setE(this.value)">'+ES.map(function(e){return '<option value="'+e[0]+'"'+((p.estado||'proceso')===e[0]?' selected':'')+'>'+e[1]+'</option>'}).join('')+'</select></div>';
    if((p.estado||'proceso')==='terminado'){var T=totP(p);h+='<div class="card" style="border-color:var(--ac)"><div class="mu">Proyecto terminado'+(p.fin?' el '+p.fin:'')+' · Total gastado en pagos</div><div class="tot">'+money(T.total)+'</div><div class="mu" style="margin:6px 0">'+T.dias+' días trabajados en total</div>'+T.det.map(function(x){return '<div class="row" style="justify-content:space-between;border-top:1px solid var(--bd);padding:6px 0"><span>'+esc(x.n)+' <span class="mu">('+x.d+' días)</span></span><b>'+money(x.m)+'</b></div>'}).join('')+'</div>';}
    h+=presuCard(p);h+=drvCard(p);
    h+='<div class="card"><div class="row"><input id="nn" placeholder="Nombre"><input id="na" placeholder="Apellido"><input id="nr" type="number" inputmode="decimal" placeholder="Pago por día" style="max-width:130px"><button onclick="addW()">Agregar</button></div></div>';
    var total=0,totA=0;
    if(p.trab.length){
      p.trab.forEach(function(w){var o=wk(p,w);h+=o.h;total+=o.t});
      h+='<div class="mu" style="text-align:center;margin-bottom:12px">Total del mes (todos): '+money(total)+'</div>';
    }else h+='<p class="mu">Agrega trabajadores para empezar a marcar asistencia.</p>';
    h+=notasCard(p);
  }
  var w=ed&&P()?P().trab.find(function(x){return x.id===ed}):null;
  if(w){
    var tp=['Ahorros','Corriente','Otra'];
    var sb=BK.indexOf(w.banco)>-1?w.banco:(w.banco?'Otro':'');
    h+='<div class="ov"><div class="md"><div class="row" style="justify-content:space-between"><b style="font-size:18px">Datos del trabajador</b><button class="g" onclick="ed=null;render()">Cerrar</button></div>'
    +'<label>Nombre</label><input value="'+esc(w.nombre)+'" onchange="setF(\'nombre\',this.value)">'
    +'<label>Apellido</label><input value="'+esc(w.apellido||'')+'" onchange="setF(\'apellido\',this.value)">'
    +'<label>Teléfono</label><input type="tel" inputmode="tel" value="'+esc(w.telefono||'')+'" onchange="setF(\'telefono\',this.value)">'
    +'<label>Tipo de documento</label><select onchange="setF(\'tdoc\',this.value);render()">'
    +['Cédula','Pasaporte'].map(function(t){return '<option'+((w.tdoc||'Cédula')===t?' selected':'')+'>'+t+'</option>'}).join('')+'</select>'
    +'<label>Número de '+((w.tdoc||'Cédula')==='Pasaporte'?'pasaporte':'cédula')+'</label><input value="'+esc(w.cedula||'')+'" onchange="setF(\'cedula\',this.value)">'
    +'<label>Banco</label><select onchange="setB(this.value)"><option value="">Seleccionar</option>'
    +BK.map(function(b){return '<option'+(sb===b?' selected':'')+'>'+b+'</option>'}).join('')+'<option'+(sb==='Otro'?' selected':'')+'>Otro</option></select>'
    +(sb==='Otro'?'<input style="margin-top:8px" placeholder="Escribe el nombre del banco" value="'+esc(w.banco==='Otro'?'':w.banco)+'" onchange="setB(this.value||\'Otro\',1)">':'')
    +'<label>Tipo de cuenta</label><select onchange="setF(\'tipo\',this.value)"><option value="">Seleccionar</option>'
    +tp.map(function(t){return '<option'+(w.tipo===t?' selected':'')+'>'+t+'</option>'}).join('')+'</select>'
    +'<label>Número de cuenta</label><input inputmode="numeric" value="'+esc(w.cuenta||'')+'" onchange="setF(\'cuenta\',this.value)">'
    +qsec(w)+mvsec(w)+'<p class="mu">Se guarda automáticamente en este dispositivo.</p><button class="g" style="width:100%;color:#c0392b;border-color:#c0392b" onclick="delW(\''+w.id+'\')">🗑 Borrar este trabajador</button></div></div>';
  }
  h+=empM()+payM()+vwM()+upM()+akM()+fpM()+qaM();var _m=document.querySelector('.md'),_s=_m?_m.scrollTop:0;$('app').innerHTML=h;_m=document.querySelector('.md');if(_m)_m.scrollTop=_s;
}
var BK=['Banco Popular Dominicano','Banreservas','Banco BHD','Scotiabank','Banco Santa Cruz','Banesco','Banco Caribe','Banco Promerica','Banco BDI','Banco López de Haro','Banco Vimenca','Banco Lafise','Banco ADEMI','Banco ADOPEM','Banco Activo','Banco Agrícola','Citibank','Asociación Popular','Asociación Cibao','Asociación La Nacional','Asociación Duarte'];
var PK='asistencia_pin',un=false,pb='',pf=null,lm='';
function hsh(s){return Promise.resolve().then(function(){if(window.crypto&&crypto.subtle){return crypto.subtle.digest('SHA-256',new TextEncoder().encode('as:'+s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return 'x'+h})}
function gp(){try{return localStorage.getItem(PK)}catch(e){return null}}
function lock(sk){var has=gp(),E=S.empresa||{},ttl=has?'Ingresa tu PIN':(pf===null?'Crea tu PIN':'Confirma tu PIN'),dots='',k='',i;
  for(i=0;i<6;i++)dots+='<i class="'+(i<pb.length?'f':'')+'"></i>';
  for(i=1;i<10;i++)k+='<button onclick="kp('+i+')">'+i+'</button>';
  k+='<button class="g" onclick="kb()">⌫</button><button onclick="kp(0)">0</button><button class="go" onclick="goPin()">✓</button>';
  $('app').innerHTML='<div class="lk"><div class="lkI">🔒</div><div class="mu" style="letter-spacing:2px;font-size:12px">'+esc((E.nombre||'CONTROL DE PROYECTOS').toUpperCase())+'</div><h1 style="margin:6px 0 2px">'+ttl+'</h1><div class="mu">'+(has?'Acceso protegido':'Elige de 4 a 6 números')+'</div><div class="dots'+(sk?' sk':'')+'">'+dots+'</div><div class="mu" style="min-height:20px;color:#ff6b6b">'+lm+'</div><div class="kp">'+k+'</div></div>'}
function kp(d){if(pb.length>=6)return;pb+=d;lm='';lock();if(pb.length===6)goPin()}
function kb(){pb=pb.slice(0,-1);lm='';lock()}
function goPin(){var has=gp();
  if(pb.length<4){lm='El PIN debe tener de 4 a 6 números';lock(1);return}
  if(!has){
    if(pf===null){pf=pb;pb='';lm='';lock();return}
    if(pb!==pf){pf=null;pb='';lm='Los PIN no coinciden. Inténtalo de nuevo';lock(1);return}
    var v=pb;hsh(v).then(function(x){try{localStorage.setItem(PK,x)}catch(e){}un=true;pb='';pf=null;lm='';render()});return}
  var v2=pb;hsh(v2).then(function(x){if(x===has){un=true;pb='';lm='';render()}else{pb='';lm='PIN incorrecto';lock(1)}})}
document.addEventListener('keydown',function(e){if(un)return;if(/^\d$/.test(e.key))kp(+e.key);else if(e.key==='Backspace')kb();else if(e.key==='Enter')goPin()});
function chPin(){ask('¿Cambiar el PIN? Te pedirá crear uno nuevo.',function(){try{localStorage.removeItem(PK)}catch(e){}un=false;render()},'Sí, cambiar')}
document.addEventListener('visibilitychange',function(){if(document.hidden){un=false;render()}});
var MS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function fdm(x){return x.slice(8)+'/'+x.slice(5,7)+'/'+x.slice(0,4)}
function qk(f){return f.slice(0,7)+(+f.slice(8)<=15?'-1':'-2')}
function sv(z){return z.reduce(function(t,x){return t+x[1]},0)}
function pad2(n){return (n<10?'0':'')+n}
function td(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function fm(n){return String(n)}
function rango(y){var a=y.dias.map(function(x){return x[0]}),mn=Math.min.apply(null,a),mx=Math.max.apply(null,a);return mn===mx?'día '+mn:'del '+mn+' al '+mx}
function fts(y,pf){if(y.legacy||!y.ts)return fdm(y.f);var d=new Date(y.ts),h=d.getHours(),ap=h>=12?'PM':'AM';h=h%12||12;return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear()+(pf?' - ':' — ')+h+':'+pad2(d.getMinutes())+' '+ap}
function hm(y){var d=new Date(y.ts),h=d.getHours(),ap=h>=12?'PM':'AM';h=h%12||12;return h+'.'+pad2(d.getMinutes())+ap}
function qList(w){var g={},pd=w.pd||{};
  Object.keys(w.dias).sort().forEach(function(f){var k=qk(f);(g[k]=g[k]||[]).push([+f.slice(8),w.dias[f],f])});
  return Object.keys(g).sort().map(function(k){var a=g[k],un=a.filter(function(x){return !pd[x[2]]}),pays=(w.pagos||[]).filter(function(x){return x.k===k}),mp=pays.reduce(function(t,x){return t+x.m},0);
    return{k:k,mes:k.slice(0,7),q:k.slice(-1),all:a,un:un,dias:a.map(function(x){return x[0]+(x[1]===0.5?'½':'')}),n:sv(a),nu:sv(un),mu:sv(un)*w.pago,m:mp+sv(un)*w.pago,pays:pays,mpaid:mp,paid:un.length===0&&pays.length>0,part:pays.length>0&&un.length>0}})}
function mig(){S.proyectos.forEach(function(p){p.trab.forEach(function(w){
  if(w.pagos||!w.qp||!Object.keys(w.qp).length){w.pagos=w.pagos||[];w.pd=w.pd||{};return}
  w.pagos=[];w.pd={};
