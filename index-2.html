<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de Proyectos</title>
<meta name="theme-color" content="#070b16">
<style>
:root{--bg:#070b16;--card:rgba(255,255,255,.045);--tx:#e8edf7;--mu:#8b97ad;--ac:#22d3ee;--ac2:rgba(34,211,238,.13);--bd:rgba(255,255,255,.09);--gr:linear-gradient(135deg,#22d3ee,#6366f1);--sol:#0f1527;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1000px 520px at 85% -10%,rgba(99,102,241,.25),transparent 60%),radial-gradient(800px 480px at -10% 8%,rgba(34,211,238,.15),transparent 55%),var(--bg);background-attachment:fixed;color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));min-height:100vh}
h1{font-size:20px;margin:6px 0 12px;letter-spacing:.3px}
h3{letter-spacing:.8px;text-transform:uppercase;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.28)}
input,select{font:inherit;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:10px;padding:10px;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(34,211,238,.18)}
option{background:#111827;color:#e8edf7}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 14px;background:var(--gr);color:#04121c;cursor:pointer;box-shadow:0 4px 18px rgba(34,211,238,.22)}
button.g{background:transparent;color:var(--mu);border:1px solid var(--bd);box-shadow:none}
button.x{background:transparent;color:#ff6b6b;padding:4px 8px;box-shadow:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input{flex:1}
.proj{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--bd);border-radius:12px;margin-top:8px;cursor:pointer;background:rgba(255,255,255,.03)}
.mu{color:var(--mu);font-size:14px}
.wrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;font-size:14px}
th,td{border:1px solid var(--bd);padding:0;text-align:center;min-width:34px;height:38px}
th{background:rgba(255,255,255,.05);font-weight:600}
td.n,th.n{position:sticky;left:0;background:var(--sol);min-width:170px;max-width:170px;text-align:left;padding:4px 8px;z-index:1}
td.t{min-width:84px;padding:4px 8px;white-space:nowrap}
td.d{cursor:pointer;user-select:none}
td.on{background:var(--gr);color:#04121c;font-weight:700}
td.hoy{outline:2px solid var(--ac);outline-offset:-2px}
.tot{font-size:24px;font-weight:700;color:var(--ac);text-shadow:0 0 18px rgba(34,211,238,.35)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:9;padding-top:env(safe-area-inset-top,0px)}
.md{background:var(--sol);border:1px solid var(--bd);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.md label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.md input,.md select{width:100%}
.hd{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.lg{width:46px;height:46px;flex:none;border-radius:13px;background:var(--gr);color:#04121c;font-weight:800;font-size:21px;display:grid;place-items:center;box-shadow:0 0 24px rgba(34,211,238,.45)}
.ttl{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.sc span{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
.sc b{font-size:20px}.sc b.a{color:var(--ac)}.sc b.w{color:#fbbf24}
</style>
</head>
<body>
<div id="app"></div>
<script>
var K='asistencia_v1',S={proyectos:[]},pid=null,ed=null,emp=false,mes=new Date().toISOString().slice(0,7);
try{var r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,9)}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return '$'+n.toLocaleString('es-MX',{maximumFractionDigits:2})}
function P(){return S.proyectos.find(function(p){return p.id===pid})}

function render(){
  if(!un)return lock();
  var h='';
  if(!pid||!P()){
    h+=''+dash()+'<div class="card"><div class="row"><input id="np" placeholder="Nombre del proyecto"><select id="ne"><option value="pendiente">Pendiente</option><option value="proceso">En proceso</option><option value="terminado">Terminado</option></select><button onclick="addP()">Agregar</button></div>';
    ES.forEach(function(e){
      var L=S.proyectos.filter(function(p){return (p.estado||'proceso')===e[0]});
      h+='<h3 style="margin:16px 0 0;font-size:15px">'+e[1]+' ('+L.length+')</h3>';
      L.forEach(function(p){
        h+='<div class="proj" onclick="pid=\''+p.id+'\';render()"><div><b>'+esc(p.nombre)+'</b><div class="mu">'+p.trab.length+' trabajadores · '+(e[0]==='terminado'?'Total pagado: ':'Pagado hasta hoy: ')+money(totP(p).total)+'</div></div><span>›</span></div>';
      });
      if(!L.length)h+='<div class="mu" style="margin-top:6px">Ninguno</div>';
    });
    if(!S.proyectos.length)h+='<p class="mu">Aún no hay proyectos. Crea el primero arriba.</p>';
    h+='</div>';
  }else{
    var p=P(),y=+mes.slice(0,4),m=+mes.slice(5),nd=new Date(y,m,0).getDate(),hoy=new Date().toISOString().slice(0,10);
    var nom=new Date(y,m-1,1).toLocaleDateString('es-MX',{month:'long',year:'numeric'});
    h+='<div class="row" style="margin-bottom:8px"><button class="g" onclick="pid=null;render()">‹ Proyectos</button><button class="x" onclick="delP()">Borrar proyecto</button></div>';
    h+='<h1>'+esc(p.nombre)+'</h1>';
    h+='<div class="card"><div class="mu">Estado del proyecto</div><select style="width:100%;margin-top:6px" onchange="setE(this.value)">'+ES.map(function(e){return '<option value="'+e[0]+'"'+((p.estado||'proceso')===e[0]?' selected':'')+'>'+e[1]+'</option>'}).join('')+'</select></div>';
    if((p.estado||'proceso')==='terminado'){var T=totP(p);h+='<div class="card" style="border-color:var(--ac)"><div class="mu">Proyecto terminado'+(p.fin?' el '+p.fin:'')+' · Total gastado en pagos</div><div class="tot">'+money(T.total)+'</div><div class="mu" style="margin:6px 0">'+T.dias+' días trabajados en total</div>'+T.det.map(function(x){return '<div class="row" style="justify-content:space-between;border-top:1px solid var(--bd);padding:6px 0"><span>'+esc(x.n)+' <span class="mu">('+x.d+' días)</span></span><b>'+money(x.m)+'</b></div>'}).join('')+'</div>';}
    h+='<div class="card row" style="justify-content:space-between"><button class="g" onclick="cm(-1)">‹</button><b style="text-transform:capitalize">'+nom+'</b><button class="g" onclick="cm(1)">›</button></div>';
    h+='<div class="card"><div class="row"><input id="nn" placeholder="Nombre"><input id="na" placeholder="Apellido"><input id="nr" type="number" inputmode="decimal" placeholder="Pago por día" style="max-width:130px"><button onclick="addW()">Agregar</button></div></div>';
    var total=0;
    if(p.trab.length){
      h+='<div class="card wrap"><table><tr><th class="n">Trabajador</th>';
      var DS=['Do','Lu','Ma','Mi','Ju','Vi','Sá'];
      for(var d=1;d<=nd;d++){var wd=new Date(y,m-1,d).getDay();h+='<th'+(wd==0||wd==6?' style="background:var(--ac2)"':'')+'><div class="mu" style="font-size:11px">'+DS[wd]+'</div>'+d+'</th>';}
      h+='<th>Días</th><th>Total</th></tr>';
      p.trab.forEach(function(w){
        var c=0,cells='';
        for(var d=1;d<=nd;d++){
          var f=mes+'-'+(d<10?'0'+d:d),on=w.dias[f];
          if(on)c++;
          cells+='<td class="d'+(on?' on':'')+(f===hoy?' hoy':'')+'" onclick="tg(\''+w.id+'\',\''+f+'\')">'+(on?'✓':'')+'</td>';
        }
        var t=c*w.pago;total+=t;
        h+='<tr><td class="n"><b style="text-decoration:underline;cursor:pointer" onclick="ed=\''+w.id+'\';render()">'+esc(w.nombre+(w.apellido?' '+w.apellido:''))+'</b><br><span class="mu">$<input type="number" inputmode="decimal" value="'+w.pago+'" onchange="setR(\''+w.id+'\',this.value)" style="width:72px;padding:4px"> /día</span><br><button style="padding:5px 9px;font-size:13px;margin-top:4px" onclick="ed=\''+w.id+'\';render()">📋 Datos</button> <button class="g" style="padding:5px 9px;font-size:13px;margin-top:4px" onclick="pdf(\''+w.id+'\')">📄 PDF</button> <button class="g" style="padding:5px 9px;font-size:13px;margin-top:4px;color:#c0392b;border-color:#c0392b" onclick="delW(\''+w.id+'\')">🗑 Borrar</button></td>'+cells+'<td class="t">'+c+'</td><td class="t"><b>'+money(t)+'</b></td></tr>';
      });
      h+='</table></div><div class="card"><div class="mu">Total a pagar del mes</div><div class="tot">'+money(total)+'</div></div>';
    }else h+='<p class="mu">Agrega trabajadores para empezar a marcar asistencia.</p>';
  }
  var w=ed&&P()?P().trab.find(function(x){return x.id===ed}):null;
  if(w){
    var tp=['Ahorros','Corriente','Otra'];
    var sb=BK.indexOf(w.banco)>-1?w.banco:(w.banco?'Otro':'');
    h+='<div class="ov"><div class="md"><div class="row" style="justify-content:space-between"><b style="font-size:18px">Datos del trabajador</b><button class="g" onclick="ed=null;render()">Cerrar</button></div>'
    +'<label>Nombre</label><input value="'+esc(w.nombre)+'" onchange="setF(\'nombre\',this.value)">'
    +'<label>Apellido</label><input value="'+esc(w.apellido||'')+'" onchange="setF(\'apellido\',this.value)">'
    +'<label>Teléfono</label><input type="tel" inputmode="tel" value="'+esc(w.telefono||'')+'" onchange="setF(\'telefono\',this.value)">'
    +'<label>Tipo de documento</label><select onchange="setF(\'tdoc\',this.value);render()">'
    +['Cédula','Pasaporte'].map(function(t){return '<option'+((w.tdoc||'Cédula')===t?' selected':'')+'>'+t+'</option>'}).join('')+'</select>'
    +'<label>Número de '+((w.tdoc||'Cédula')==='Pasaporte'?'pasaporte':'cédula')+'</label><input value="'+esc(w.cedula||'')+'" onchange="setF(\'cedula\',this.value)">'
    +'<label>Banco</label><select onchange="setB(this.value)"><option value="">Seleccionar</option>'
    +BK.map(function(b){return '<option'+(sb===b?' selected':'')+'>'+b+'</option>'}).join('')+'<option'+(sb==='Otro'?' selected':'')+'>Otro</option></select>'
    +(sb==='Otro'?'<input style="margin-top:8px" placeholder="Escribe el nombre del banco" value="'+esc(w.banco==='Otro'?'':w.banco)+'" onchange="setB(this.value||\'Otro\',1)">':'')
    +'<label>Tipo de cuenta</label><select onchange="setF(\'tipo\',this.value)"><option value="">Seleccionar</option>'
    +tp.map(function(t){return '<option'+(w.tipo===t?' selected':'')+'>'+t+'</option>'}).join('')+'</select>'
    +'<label>Número de cuenta</label><input inputmode="numeric" value="'+esc(w.cuenta||'')+'" onchange="setF(\'cuenta\',this.value)">'
    +qsec(w)+'<p class="mu">Se guarda automáticamente en este dispositivo.</p><button class="g" style="width:100%;color:#c0392b;border-color:#c0392b" onclick="delW(\''+w.id+'\')">🗑 Borrar este trabajador</button></div></div>';
  }
  h+=empM();$('app').innerHTML=h;
}
var BK=['Banco Popular Dominicano','Banreservas','Banco BHD','Scotiabank','Banco Santa Cruz','Banesco','Banco Caribe','Banco Promerica','Banco BDI','Banco López de Haro','Banco Vimenca','Banco Lafise','Banco ADEMI','Banco ADOPEM','Banco Activo','Banco Agrícola','Citibank','Asociación Popular','Asociación Cibao','Asociación La Nacional','Asociación Duarte'];
var PK='asistencia_pin',un=false;
function hsh(s){return Promise.resolve().then(function(){if(window.crypto&&crypto.subtle){return crypto.subtle.digest('SHA-256',new TextEncoder().encode('as:'+s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return 'x'+h})}
function gp(){try{return localStorage.getItem(PK)}catch(e){return null}}
function lock(){var has=gp();
  $('app').innerHTML='<div class="card" style="margin-top:12vh;text-align:center"><div style="font-size:40px">🔒</div><h1>'+(has?'Ingresa tu PIN':'Crea tu PIN')+'</h1><input id="pn" type="password" inputmode="numeric" maxlength="6" placeholder="PIN (4 a 6 números)" style="width:100%;text-align:center;font-size:22px">'+(has?'':'<input id="pc" type="password" inputmode="numeric" maxlength="6" placeholder="Repite el PIN" style="width:100%;text-align:center;font-size:22px;margin-top:8px">')+'<p id="pe" style="color:#c0392b;min-height:20px;margin:8px 0"></p><button style="width:100%" onclick="goPin()">'+(has?'Entrar':'Guardar PIN')+'</button></div>';}
function goPin(){var v=$('pn').value,has=gp();
  if(!/^\d{4,6}$/.test(v)){$('pe').textContent='El PIN debe tener de 4 a 6 números';return}
  if(!has){if(v!==$('pc').value){$('pe').textContent='Los PIN no coinciden';return}
    hsh(v).then(function(x){try{localStorage.setItem(PK,x)}catch(e){}un=true;render()});return}
  hsh(v).then(function(x){if(x===has){un=true;render()}else{$('pe').textContent='PIN incorrecto';$('pn').value=''}})}
function chPin(){if(confirm('¿Cambiar el PIN? Te pedirá crear uno nuevo.')){try{localStorage.removeItem(PK)}catch(e){}un=false;render()}}
document.addEventListener('visibilitychange',function(){if(document.hidden){un=false;render()}});
var MS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function fdm(x){return x.slice(8)+'/'+x.slice(5,7)+'/'+x.slice(0,4)}
function qk(f){return f.slice(0,7)+(+f.slice(8)<=15?'-1':'-2')}
function qList(w){var g={};Object.keys(w.dias).sort().forEach(function(f){var k=qk(f);(g[k]=g[k]||[]).push(+f.slice(8))});
  return Object.keys(g).sort().map(function(k){var dd=g[k],pg=(w.qp||{})[k],ok=pg&&pg.n===dd.length?pg:null;return{k:k,mes:k.slice(0,7),q:k.slice(-1),dias:dd,m:ok?ok.m:dd.length*w.pago,paid:ok}})}
function togQ(id,k){var w=P().trab.find(function(x){return x.id===id}),q=qList(w).find(function(x){return x.k===k});w.qp=w.qp||{};
  if(q.paid)delete w.qp[k];else w.qp[k]={f:new Date().toISOString().slice(0,10),m:q.dias.length*w.pago,n:q.dias.length};save();render()}
function qsec(w){var L=qList(w).reverse(),h='<label>Pagos por quincena</label>';
  if(!L.length)return h+'<div class="mu">Aún no hay días marcados.</div>';
  L.forEach(function(q){h+='<div class="row" style="justify-content:space-between;border-top:1px solid var(--bd);padding:8px 0"><div><b>'+MS[+q.mes.slice(5)-1]+' '+q.mes.slice(0,4)+' · '+(q.q==='1'?'1.ª quincena':'2.ª quincena')+'</b><div class="mu">'+q.dias.length+' días · '+money(q.m)+'</div></div><button class="'+(q.paid?'':'g')+'" style="padding:6px 10px" onclick="togQ(\''+w.id+'\',\''+q.k+'\')">'+(q.paid?'✓ Pagado':'Marcar pagado')+'</button></div>'});
  return h+'<div class="row" style="margin-top:10px"><button style="flex:1" onclick="pdf(\''+w.id+'\')">📄 Historial completo</button><button class="g" style="flex:1" onclick="pdf(\''+w.id+'\',\''+mes+'\')">📄 Solo '+MS[+mes.slice(5)-1]+'</button></div>'}
function dash(){var E=S.empresa||{},pg=0,pen=0,nt=0,ap=0;
  S.proyectos.forEach(function(p){if((p.estado||'proceso')==='proceso')ap++;p.trab.forEach(function(w){nt++;qList(w).forEach(function(q){if(q.paid)pg+=q.m;else pen+=q.m})})});
  return '<div class="hd"><div class="lg">'+esc((E.nombre||'M').charAt(0).toUpperCase())+'</div><div style="flex:1;min-width:0"><div class="mu" style="font-size:11px;letter-spacing:1.5px">PANEL DE CONTROL</div><div class="ttl">'+esc(E.nombre||'Configura tu empresa')+'</div></div><button class="g" onclick="emp=true;render()">⚙</button><button class="g" onclick="un=false;render()">🔒</button></div><div class="st"><div class="sc"><span>Proyectos en proceso</span><b>'+ap+'</b></div><div class="sc"><span>Trabajadores</span><b>'+nt+'</b></div><div class="sc"><span>Pagado</span><b class="a">'+money(pg)+'</b></div><div class="sc"><span>Por pagar</span><b class="w">'+money(pen)+'</b></div></div>'}
function setEm(k,v){S.empresa=S.empresa||{};S.empresa[k]=v.trim();save()}
function empM(){if(!emp)return '';var E=S.empresa||{};
  function f(l,k,t){return '<label>'+l+'</label><input '+(t||'')+' value="'+esc(E[k]||'')+'" onchange="setEm(\''+k+'\',this.value)">'}
  return '<div class="ov"><div class="md"><div class="row" style="justify-content:space-between"><b style="font-size:18px">Datos de la empresa</b><button class="g" onclick="emp=false;render()">Cerrar</button></div>'+f('Nombre de la empresa','nombre')+f('RNC / ID fiscal','rnc')+f('Dirección','dir')+f('Teléfono','tel','type="tel" inputmode="tel"')+f('Correo','email','type="email"')+f('Nombre del responsable (firma)','rep')+'<p class="mu">Estos datos salen en el encabezado de las constancias de pago en PDF.</p><button class="g" style="width:100%" onclick="chPin()">Cambiar PIN</button></div></div>'}
function ldPdf(cb){var e=document.createElement('script');e.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';e.onload=function(){window.jspdf?cb():alert('No se pudo cargar el generador de PDF.')};e.onerror=function(){alert('No se pudo cargar el generador de PDF. Revisa tu conexión a internet.')};document.head.appendChild(e)}
function pdf(id,om){
  if(!window.jspdf)return ldPdf(function(){pdf(id,om)});
  var p=P(),w=p.trab.find(function(x){return x.id===id}),E=S.empresa||{},d=new window.jspdf.jsPDF({unit:'pt',format:'a4'}),W=595,M=40,y;
  var L=qList(w);if(om)L=L.filter(function(q){return q.mes===om});
  if(!L.length)return alert('No hay días marcados para generar la constancia');
  var nom=w.nombre+(w.apellido?' '+w.apellido:''),hoy=new Date().toISOString().slice(0,10);
  d.setFillColor(11,16,32);d.rect(0,0,W,96,'F');d.setFillColor(34,211,238);d.rect(0,96,W,3,'F');
  d.setTextColor(255,255,255);d.setFont('helvetica','bold');d.setFontSize(18);d.text(E.nombre||'Mi empresa',M,42);
  d.setFont('helvetica','normal');d.setFontSize(9);
  [E.rnc?'RNC / ID: '+E.rnc:'',E.dir||'',[E.tel,E.email].filter(Boolean).join('   |   ')].filter(Boolean).forEach(function(t,i){d.text(t,M,58+i*12)});
  d.text('Emitido: '+fdm(hoy),W-M,42,{align:'right'});
  d.setTextColor(20,20,30);d.setFont('helvetica','bold');d.setFontSize(15);d.text('CONSTANCIA DE PAGOS',M,130);
  d.setFontSize(10);y=150;
  [['Trabajador',nom],['Documento',(w.tdoc||'Cédula')+': '+(w.cedula||'-')],['Teléfono',w.telefono||'-'],['Proyecto',p.nombre],['Pago por día',money(w.pago)],['Período',om?MS[+om.slice(5)-1]+' '+om.slice(0,4):'Historial completo']].forEach(function(r){d.setFont('helvetica','bold');d.text(r[0]+':',M,y);d.setFont('helvetica','normal');d.text(String(r[1]),M+90,y);y+=15});
  y+=14;
  function head(){d.setFillColor(11,16,32);d.rect(M,y-11,W-2*M,18,'F');d.setTextColor(255,255,255);d.setFont('helvetica','bold');d.setFontSize(9);d.text('Período',M+6,y+1);d.text('Días',215,y+1);d.text('Fechas (días)',250,y+1);d.text('Monto',440,y+1);d.text('Estado',495,y+1);d.setTextColor(20,20,30);y+=20}
  head();
  var tD=0,tP=0,tN=0,sm=0,sd=0,cm=null;
  function sub(){if(cm===null)return;d.setFont('helvetica','bold');d.setFontSize(9);d.text('Subtotal '+MS[+cm.slice(5)-1]+' '+cm.slice(0,4),M+6,y+2);d.text(String(sd),215,y+2);d.text(money(sm),440,y+2);y+=18}
  L.forEach(function(q){
    if(cm!==null&&q.mes!==cm){sub();sm=0;sd=0}
    cm=q.mes;
    var ft=d.splitTextToSize(q.dias.join(', '),180),h=Math.max(ft.length*11,12)+8;
    if(y+h>770){d.addPage();y=50;head()}
    d.setFont('helvetica','normal');d.setFontSize(9);
    d.text(MS[+q.mes.slice(5)-1].slice(0,3)+' '+q.mes.slice(0,4)+' - '+(q.q==='1'?'1.ª quincena (1-15)':'2.ª quincena (16-fin)'),M+6,y+2);
    d.text(String(q.dias.length),215,y+2);d.text(ft,250,y+2);d.text(money(q.m),440,y+2);
    d.text(q.paid?'Pagado '+fdm(q.paid.f).slice(0,5):'Pendiente',495,y+2);
    d.setDrawColor(220,220,225);d.line(M,y+h-4,W-M,y+h-4);y+=h;
    sm+=q.m;sd+=q.dias.length;tD+=q.dias.length;if(q.paid)tP+=q.m;else tN+=q.m});
  sub();
  if(y>700){d.addPage();y=50}
  y+=8;d.setFillColor(236,246,250);d.rect(M,y-12,W-2*M,58,'F');d.setFont('helvetica','bold');d.setFontSize(10);
  d.text('Total de días trabajados: '+tD,M+10,y+2);d.text('Total pagado: '+money(tP),M+10,y+18);d.text('Total pendiente de pago: '+money(tN),M+10,y+34);
  y+=84;if(y>740){d.addPage();y=60}
  d.setDrawColor(60,60,70);d.line(M+20,y+30,M+200,y+30);d.setFont('helvetica','normal');d.setFontSize(9);d.text('Firma autorizada',M+20,y+44);if(E.rep)d.text(E.rep,M+20,y+56);
  d.setTextColor(120,120,130);d.setFontSize(8);d.text('Montos calculados según los días registrados en el proyecto. "Pagado" indica un pago registrado en el sistema.',M,812);
  d.save('constancia-'+nom.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.pdf')}
var ES=[['pendiente','Pendientes'],['proceso','En proceso'],['terminado','Terminados']];
function totP(p){var t=0,dd=0,det=p.trab.map(function(w){var d=Object.keys(w.dias).length,m=d*w.pago;t+=m;dd+=d;return{n:w.nombre+(w.apellido?' '+w.apellido:''),d:d,m:m}});return{total:t,dias:dd,det:det}}
function setE(v){var p=P();p.estado=v;if(v==='terminado')p.fin=new Date().toLocaleDateString('es-MX');save();render()}
function setB(v,noRender){var w=P().trab.find(function(x){return x.id===ed});w.banco=v;save();if(!noRender)render()}
function setF(k,v){var w=P().trab.find(function(x){return x.id===ed});w[k]=v.trim();save()}
function addP(){var v=$('np').value.trim();if(!v)return;S.proyectos.push({id:uid(),nombre:v,estado:$('ne').value,trab:[]});save();render()}
function delP(){if(confirm('¿Borrar este proyecto y todos sus datos?')){S.proyectos=S.proyectos.filter(function(p){return p.id!==pid});pid=null;save();render()}}
function addW(){var n=$('nn').value.trim(),r=parseFloat($('nr').value);if(!n||isNaN(r))return alert('Pon el nombre y el pago por día');P().trab.push({id:uid(),nombre:n,apellido:$('na').value.trim(),pago:r,dias:{}});save();render()}
function setR(id,v){var r=parseFloat(v);if(isNaN(r))return render();P().trab.find(function(x){return x.id===id}).pago=r;save();render()}
function delW(id){if(confirm('¿Quitar a este trabajador?')){var p=P();p.trab=p.trab.filter(function(w){return w.id!==id});ed=null;save();render()}}
function tg(id,f){var w=P().trab.find(function(x){return x.id===id});if(w.dias[f])delete w.dias[f];else w.dias[f]=1;save();render()}
function cm(n){var y=+mes.slice(0,4),m=+mes.slice(5)+n;var d=new Date(y,m-1,1);mes=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}
render();
</script>
